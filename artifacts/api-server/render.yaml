# render.yaml — Render deployment configuration for KrishiApp Flask API + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: krishiapp-postgres
    databaseName: krishiapp
    user: krishi
    region: singapore   # closest to Bangladesh; change if preferred
    plan: free          # free tier database on Render

services:
  - type: web
    name: krishiappbackend
    runtime: python
    rootDir: artifacts/api-server   # Point Render to this folder
    region: singapore
    plan: free          # upgrade to starter for always-on (free sleeps after 15min)

    buildCommand: pip install -r requirements.txt && python init_database.py
    startCommand: gunicorn "api:create_app()" --bind "0.0.0.0:$PORT" --workers 2 --timeout 60

    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: krishiapp-postgres
          property: connectionString
      - key: API_KEY
        generateValue: true   # Render auto-generates a random value
